ong>让绿意，住进日常</strong><p>一盆植物的温柔陪伴</p></div><div class="small-card"><span class="icon">☕︎</span><strong>一杯咖啡的时间</strong><p>不慌不忙，刚刚好</p></div></div></div><div id="savedEmpty" class="empty" hidden>还没有收藏<br>点亮文章旁的书签，把喜欢留下来。</div><p class="demo-label">POCKET 内置互动示例 · 可替换为你的 H5</p></main><nav class="bottom-nav" aria-label="示例页面导航"><button data-tab="home" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3Zm6 10v-6h6v6"/></svg>首页</button><button data-tab="explore" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5Z"/></svg>发现</button><button data-tab="saved" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></svg>收藏</button></nav><div id="demoToast" class="demo-toast" role="status" hidden></div><script>
let timer; const save = document.getElementById('saveButton'); let activeTab = 'home';
function message(text) { clearTimeout(timer); const box = document.getElementById('demoToast'); box.textContent=text;box.hidden=false;timer=setTimeout(()=>box.hidden=true,1800); }
function updateSaved(){ const empty=activeTab==='saved' && save.getAttribute('aria-pressed')!=='true'; document.getElementById('feed').hidden=empty;document.getElementById('savedEmpty').hidden=!empty; }
save.addEventListener('click',()=>{ const selected=save.getAttribute('aria-pressed')!=='true';save.setAttribute('aria-pressed',String(selected));message(selected?'已加入收藏':'已取消收藏');updateSaved(); });
document.querySelectorAll('[data-category]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const slow=button.dataset.category==='慢生活';document.getElementById('cardTitle').textContent=slow?'放慢脚步，感受当下':'山野之间，自在呼吸';document.getElementById('cardSubtitle').textContent=slow?'生活手记 · 约 3 分钟阅读':'周末灵感 · 约 5 分钟阅读';}));
document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{activeTab=button.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));updateSaved();if(activeTab==='explore'){document.querySelector('[data-category="去自然里"]').click();message('发现自然里的小灵感');}}));
</script></body></html>
